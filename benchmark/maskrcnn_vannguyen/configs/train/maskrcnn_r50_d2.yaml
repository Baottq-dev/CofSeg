# Mask R-CNN R50-FPN trên detectron2 — MỐC SỐ 0 của bảng benchmark.
#
# Người phụ trách: VanNguyen. Recipe dùng chung ở configs/train/_base_d2.yaml;
# file này chỉ đặt tên lần chạy và kiến trúc.
#
# Vì sao có bản này bên cạnh configs/train/maskrcnn_r50.yaml (torchvision):
# Cascade và Mask2Former chỉ có trong detectron2, và "Cascade hơn Mask R-CNN
# bao nhiêu" chỉ có nghĩa khi hai bên chạy cùng một mã, cùng mapper, cùng lịch
# lr. Bản torchvision vẫn dùng để chạy sớm ở nhà (Windows); vào bảng thì dùng
# bản này.
#
#     python benchmark/maskrcnn_vannguyen/scripts/train.py --config benchmark/maskrcnn_vannguyen/configs/train/maskrcnn_r50_d2.yaml --set data.root=data/export/f4 --workers 8
#     python benchmark/maskrcnn_vannguyen/scripts/train.py --config benchmark/maskrcnn_vannguyen/configs/train/maskrcnn_r50_d2.yaml --probe
#     python benchmark/maskrcnn_vannguyen/scripts/train.py --config benchmark/maskrcnn_vannguyen/configs/train/maskrcnn_r50_d2.yaml --set data.limit=16 --epochs 1   # khói

base: _base_d2.yaml
name: maskrcnn-r50-d2

model:
  # maskrcnn | cascade | mask2former | pointrend. Config và trọng số COCO lấy
  # từ model zoo theo arch; ghi đè bằng model.config_file / model.weights.
  arch: maskrcnn
