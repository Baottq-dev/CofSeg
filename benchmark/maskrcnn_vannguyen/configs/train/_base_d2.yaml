# Recipe CHUNG cho mọi model chạy qua detectron2 (Mask R-CNN, Cascade,
# Mask2Former). File này thuộc về CẢ NHÓM, không của riêng ai.
#
# Vì sao tách ra: "Cascade hơn Mask R-CNN bao nhiêu", "Mask2Former hơn mốc 0
# bao nhiêu" chỉ có nghĩa khi ba model chạy cùng một mã, cùng mapper, cùng
# lịch lr. Sửa một dòng ở đây là đổi số của cả ba model — báo nhóm trước.
#
# Config của từng model nằm trong thư mục người phụ trách:
#     benchmark/maskrcnn_vannguyen/configs/train/maskrcnn_r50_d2.yaml     (mốc số 0)
#     benchmark/maskrcnn_vannguyen/configs/train/cascade_r50_d2.yaml      (dự phòng)
#     benchmark/maskrcnn_vannguyen/configs/train/mask2former_r50_d2.yaml
#
# Chạy trên máy Linux có detectron2 (scripts/remote/setup.sh). Ở nhà chỉ
# --print-config / --list-params chạy được; --probe và train cần detectron2.

trainer: detectron2

data:
  # Một fold do scripts/make_fold.py cắt ra; đổi fold: --set data.root=data/export/f2
  root: data/export/f4
  train: train
  val: val
  test: test
  min_area: 50.0
  # limit: 16   # chỉ để khói; bỏ trống khi huấn luyện thật

train:
  # imgsz là CẠNH DÀI sau khi thu, cùng nghĩa với YOLO/torchvision: 2560x1440
  # -> 1024x576 (detectron2 nhận cạnh ngắn 576 + trần cạnh dài 1024).
  imgsz: 1024
  batch: 4
  epochs: 50
  # lr trống = recipe gốc tỉ lệ theo batch: 0.02 x batch/16 với R-CNN, 1e-4
  # với Mask2Former (SGD/AdamW theo config zoo). Lịch: giảm 10x ở 70% và 90%.
  lr: null
  warmup_iters: 200
  amp: true

  # Ảnh nadir không có chiều "trên": lật dọc và xoay 90° đều hợp lệ.
  # (Mask2Former giữ mapper LSJ của recipe gốc nên không áp flipud/rot90.)
  fliplr: 0.5
  flipud: 0.5
  rot90: true

  # Chấm mask AP trên val mỗi epoch (COCOEvaluator), giữ best.pth theo segm/AP.
  val_every: 1
  val_conf: 0.05
  max_det: 100

  # 0 trên Windows (paging file), 8 trên máy thuê: --workers 8
  workers: 0
  seed: 0
