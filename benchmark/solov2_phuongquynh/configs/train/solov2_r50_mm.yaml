# SOLOv2 R50-FPN trên mmdetection — họ box-free của bảng benchmark.
#
# Cùng backbone R50 với Mask R-CNN và Mask2Former; khác ở cách tìm vật thể:
# chia ảnh thành lưới, ô nào chứa tâm vật thể thì ô đó sinh mask (kernel động
# x đặc trưng mask stride 4 toàn ảnh), không box, không ROI. Trọng số khởi
# đầu: COCO ms-3x của model zoo mmdet (configs/weights.yaml).
#
# Chạy trên máy Linux có mmcv/mmdet (scripts/remote/setup.sh). Ở nhà
# --print-config / --list-params chạy được; --probe và train cần mmcv.
#
#     python benchmark/solov2_phuongquynh/scripts/train.py --config benchmark/solov2_phuongquynh/configs/train/solov2_r50_mm.yaml --set data.root=data/export/f4 --workers 8
#     python benchmark/solov2_phuongquynh/scripts/train.py --config benchmark/solov2_phuongquynh/configs/train/solov2_r50_mm.yaml --probe
#     python benchmark/solov2_phuongquynh/scripts/train.py --config benchmark/solov2_phuongquynh/configs/train/solov2_r50_mm.yaml --set data.limit=16 --epochs 1   # khói

name: solov2-r50-mm
trainer: mmdet

model:
  arch: solov2
  # config: benchmark/solov2_phuongquynh/configs/mmdet/solov2_r50_coffee.py   # phần ghi đè model; mặc định theo arch
  # weights: null  -> weights/solov2_r50_fpn_3x_coco.pth nếu đã tải (download_weights.py),
  #                   không thì URL model zoo (mmengine tự tải về cache).

data:
  # Một fold do scripts/make_fold.py cắt ra; đổi fold: --set data.root=data/export/f2
  root: data/export/f4
  train: train
  val: val
  test: test
  min_area: 50.0
  # limit: 16   # chỉ để khói; bỏ trống khi huấn luyện thật

train:
  # imgsz là CẠNH DÀI sau khi thu, cùng nghĩa với các trainer khác: 2560x1440
  # -> 1024x576. Lưới của SOLOv2 (40/36/24/16/12 ô) và dải cỡ vật thể theo
  # recipe COCO; tán ~366 px ở ảnh gốc còn ~94 px ở 1024 -> rơi vào hai tầng
  # đầu, mỗi ô ~26-28 px.
  imgsz: 1024
  batch: 4
  epochs: 50
  # lr trống = recipe gốc tỉ lệ theo batch: 0.01 x batch/16 (SGD, momentum
  # 0.9, weight decay 1e-4, clip grad 35). Lịch: giảm 10x ở 70% và 90% epoch.
  lr: null
  warmup_iters: 200
  amp: true

  # Ảnh nadir không có chiều "trên": lật ngang + lật dọc (độc lập). KHÔNG có
  # xoay 90° như detectron2/torchvision vì mmdet không có transform sẵn cho
  # mask + box — ghi nhận là chênh lệch có chủ đích khi đọc bảng.
  fliplr: 0.5
  flipud: 0.5

  # Chấm mask AP trên val mỗi epoch (CocoMetric), giữ best.pth theo coco/segm_mAP.
  val_every: 1
  val_conf: 0.05
  max_det: 100

  # 0 trên Windows, 8 trên máy thuê: --workers 8
  workers: 0
  seed: 0
