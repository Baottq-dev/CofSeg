# Mask2Former R50 (repo gốc trên detectron2). Trọng số: --set model.weights=<best.pth>
# Cần detectron2 + submodule benchmark/mask2former/upstream; ở máy không có, chấm
# predictions.json của run bằng benchmark/mask2former/configs/eval/_coco.yaml.
base: _base.yaml
name: mask2former-r50-d2
model:
  name: detectron2
  arch: mask2former
  repo: benchmark/mask2former/upstream
  # d2_config.yaml cạnh best.pth giữ imgsz và mọi khoá của lần huấn luyện.
  weights: runs/train/CHANGE_ME/weights/best.pth
  conf: 0.05
  max_det: 100
