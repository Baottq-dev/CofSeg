# Mask2Former R50 (repo gốc facebookresearch/Mask2Former trên detectron2).
#
# Người phụ trách: AnhVu. Recipe dùng chung ở configs/train/_base_d2.yaml.
#
# Cùng backbone R50 với hai model R-CNN; khác ở cơ chế query và mask toàn
# ảnh ở stride 4. Trọng số khởi đầu: COCO instance R50 của MODEL_ZOO repo.
# Recipe gốc (AdamW 1e-4 @ batch 16, backbone x0.1, clip gradient, LSJ
# 0.1-2.0 cắt ô IMAGE_SIZE) giữ nguyên trong Trainer của train_net.py; ở đây
# chỉ đặt số lớp, số query, độ phân giải, lịch theo epoch.
#
# Cần submodule benchmark/mask2former/upstream + op MSDeformAttn đã biên dịch
# (scripts/setup_env.py):
#     python benchmark/mask2former/train.py --config benchmark/mask2former/configs/train/mask2former_r50_d2.yaml --data data/export/block/f4 --workers 8
base: _base_d2.yaml
name: mask2former-r50-d2
model:
  arch: mask2former
  repo: benchmark/mask2former/upstream
train:
  # 50, khác ba model kia (100). Query-based vốn hội tụ chậm hơn R-CNN nên
  # 100 từng là mức khởi đầu, nhưng lượt chạy thử 100 epoch cho thấy best
  # epoch luôn rơi TRƯỚC mốc 50 — phần sau chỉ tốn giờ máy. Đây là chênh lệch
  # có chủ đích và đo được, ghi ra đây để bảng kết quả giải thích được nó.
  epochs: 50
  # 8, khác ba model kia (16). Không phải lựa chọn: batch 16 tràn VRAM ở
  # imgsz 1024 — Mask2Former giữ 100 query cộng attention toàn ảnh nên nó tốn
  # hơn hẳn ba model kia. `lr` để trống nên trainer tự nhân batch/16, tức
  # 1e-4 x 8/16 = 5e-5: đúng luật scale tuyến tính mà recipe gốc dùng, nên hạ
  # batch KHÔNG kéo theo lệch lịch học.
  batch: 8
  # >= số tán tối đa một ảnh (48); 100 là mặc định của recipe.
  num_queries: 100
  # 2, khác ba model kia (1). Val của model này ĐẮT HƠN train: mỗi fold là
  # 3300 vòng x 0.508 s = 28 phút huấn luyện, nhưng 50 lần val x n_val ảnh x
  # 1.194 s/ảnh, tức f6 (280 ảnh val) tốn 4h39 chỉ để chấm. Cả 6 fold ở mức 1
  # là 17.1 giờ, ở mức 2 là 10.1 giờ.
  #
  # Đo cái mất, không đoán: lượt 2026-09-26_045509 chạy 100 epoch ở val_every
  # 1 nên có đủ 98 điểm val. Quét MỌI điểm xuất phát của từng bước nhảy (chặn
  # trên thật, không phải trường hợp may):
  #     bước 2 -> mất nhiều nhất 0.041 AP, trung bình 0.020
  #     bước 3 -> 0.556 / 0.199
  #     bước 5 -> 0.573 / 0.345
  # Rẻ vì đường cong là cao nguyên: từ epoch 10 tới 100 AP nằm trong
  # 58.3-61.4, đỉnh 61.42 ở epoch 35 chỉ nhô hơn mặt bằng ~0.6. Xem 50 trong
  # 100 epoch thì gần như chắc chắn vẫn chạm cao nguyên.
  #
  # ĐỪNG áp con số này cho SOLOv2: đỉnh của nó ở epoch 8-13 trong 50 rồi TỤT
  # (đo cả 6 fold), đỉnh nhọn nên grid thô bắn trượt — bước 2 đã mất tới 0.014
  # và bước 5 mất 0.024, tức 2.4 điểm AP. SOLOv2 giữ val_every 1.
  #
  # `_base_d2.yaml` để 1 vì Mask R-CNN cần mức đó (best epoch của nó rải tới
  # 42/50); ghi đè ở đây chứ không sửa file dùng chung.
  val_every: 2
  # 2, khác ba model kia (8). Không phải tinh chỉnh tốc độ — đây là cách sống
  # với trần RAM. detectron2 dùng DATALOADER.NUM_WORKERS cho CẢ train loader
  # lẫn test loader, mà EvalHook dựng test loader mới mỗi lần chấm, nên trong
  # lúc val có 8 worker train nằm chờ CỘNG 8 worker val đang chạy = 16 tiến
  # trình python, mỗi cái là một fork mang theo torch.
  #
  # Trên máy thuê 30 GB RAM (cgroup memory.max 29.25 GiB) điều đó giết thật:
  # memory.events ghi oom_kill 5, memory.peak chạm 26.97 GiB, và CẢ BA lượt
  # đều chết ĐÚNG trong val — f1 ở epoch 4, f3 ở epoch 11, f2 ở lượt val cuối
  # cùng sau khi train đã ghi xong model_final.pth. Ba model kia không chết vì
  # footprint host mỗi worker của chúng nhỏ hơn: chỉ mapper LSJ của model này
  # mới phóng ảnh lên 2048x2048 rồi mới cắt, và dựng BitMasks ở độ phân giải
  # đầy đủ.
  #
  # 2 là đủ chứ không phải dè dặt: model này chạy 0.508 s/vòng ở batch 8, tức
  # chỉ cần 15.7 ảnh/giây, mà một worker giải mã + LSJ được vài chục ảnh/giây.
  # Nó cũng là model ÍT phụ thuộc dataloader nhất trong bốn model.
  #
  # PHẢI biết: `workers` KHÔNG vô hại về kết quả. detectron2 seed lại RNG theo
  # từng worker (worker_init_reset_seed: initial_seed + worker_id), nên đổi số
  # worker là đổi chuỗi ngẫu nhiên của augmentation. Mọi fold trong bảng phải
  # cùng một giá trị; lượt nào chạy ở 8 thì không so thẳng được với lượt chạy
  # ở 2. Vì thế nó nằm trong config chứ không phải cờ dòng lệnh.
  workers: 2
  # LSJ của recipe gốc tự lật ngang; flipud/rot90 không áp cho mapper này.
