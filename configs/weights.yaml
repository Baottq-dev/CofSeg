# Trọng số không vào git (*.pt/*.pth/weights/ trong .gitignore). Tải về weights/:
#     python scripts/download_weights.py                    # nhóm benchmark
#     python scripts/download_weights.py --group all
#     python scripts/download_weights.py --only solov2_r50_fpn_3x_coco.pth
#
# Mỗi file ghi sha256: tải xong kiểm; file đã có mà sai sha thì báo, không ghi
# đè (trừ --force). Trainer detectron2/mmdet tra URL ở đây trước: có file trong
# weights/ thì dùng, không thì tải lại từ URL về cache của framework.
dir: weights

groups:
  # 4 model chính + Cascade (tùy chọn), đủ để chạy benchmark/run.py
  benchmark:
    - yolo11s-seg.pt
    - mask_rcnn_R_50_FPN_3x_coco.pkl
    - cascade_mask_rcnn_R_50_FPN_3x_coco.pkl
    - maskformer2_R50_bs16_50ep_coco.pkl
    - solov2_r50_fpn_3x_coco.pth
  # app/ annotator (configs/config.yaml sam.checkpoint)
  annotator:
    - sam2.1_hiera_large.pt
  sam_all:
    - sam2.1_hiera_large.pt
    - sam2.1_hiera_base_plus.pt
    - sam2.1_hiera_small.pt
    - sam2.1_hiera_tiny.pt
  # model dự phòng trong ghi chú benchmark
  backup:
    - yolov8s-seg.pt
    - yolo26s-seg.pt

files:
  yolo11s-seg.pt:
    url: https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11s-seg.pt
    sha256: 1caa81c0195412efa411b632bcfb8c184939dddb6ae41f6a80c41b211ff257c3
    size_mb: 20
    for: YOLO11s-seg COCO (benchmark/yolo11/configs/train/yolo11s.yaml)
  mask_rcnn_R_50_FPN_3x_coco.pkl:
    url: https://dl.fbaipublicfiles.com/detectron2/COCO-InstanceSegmentation/mask_rcnn_R_50_FPN_3x/137849600/model_final_f10217.pkl
    sha256: 9a737e290372f1f70994ebcbd89d8004dbb3ae30a605fd915a190fa4a782dd66
    size_mb: 170
    for: Mask R-CNN R50-FPN 3x COCO, detectron2 (benchmark/maskrcnn/configs/train/maskrcnn_r50_d2.yaml)
  cascade_mask_rcnn_R_50_FPN_3x_coco.pkl:
