# YOLO + SAM-refine (cắm thêm): giữ số dự đoán và score của YOLO, chỉ thay mặt
# nạ. So với members/yolo11/configs/eval/yolo26s.yaml trên cùng split cho Δ thuần của biên.
#     python scripts/evaluate.py --config configs/eval/refine_yolo_sam2.yaml --set model.base.weights=<best.pt>
base: _base.yaml
name: yolo26s-plus-sam2refine
model:
  name: refine
  base:
    name: yolo_seg
    weights: runs/train/CHANGE_ME/ultralytics/weights/best.pt
    imgsz: 1024
    conf: 0.05
    iou: 0.7
    max_det: 100
  refiner:
    name: sam2
    size: l
    prompt: box            # box | box+mask
    box_batch: 16
