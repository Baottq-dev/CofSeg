# Các vòng gán nhãn hoa (thẻ Hoa của annotator). Đổi ruộng, số tán hay tham số
# thì sửa file này, không sửa code. Server đọc lại file mỗi lần cần, không phải
# khởi động lại.
#
# data_dir: thư mục nhãn hoa, tính từ data.masks_dir của configs/config.yaml
# (mặc định data/masks/flower_v1/). Nhãn hoa nằm riêng, không đụng nhãn tán.
version: v1
data_dir: flower_v1
rounds:
  # Vòng thử: người tự chọn tán trên ảnh, vẽ vài nét Hoa / Không hoa rồi để bộ
  # phân loại pixel tô phần còn lại. Dùng để xem vài nét có tách được lá vàng
  # dưới nắng khỏi hoa ở Field 3 không, và mỗi tán mất bao lâu.
  - id: try_f3
    label: Vòng thử Field 3
    kind: scribble               # nét vẽ + bộ phân loại pixel
    pick: {mode: manual, fields: [field_3]}
    classifier:
      n_trees: 100
      max_depth: 12
      sigma_min: 0.7             # bộ lọc nhiều thang của skimage.multiscale_basic_features
      sigma_max: 5.0
      num_sigma: 4
      max_samples: 50000         # tối đa số pixel học, chia đều hai lớp
      unlabeled_ratio: 4         # lấy thêm pixel chưa tô làm mẫu "không hoa" yếu, gấp 4 lần số pixel nét Hoa
      unlabeled_weight: 0.1      # trọng số của các mẫu đó (nét của người = 1)

  # Bộ test: 1 ảnh mỗi ruộng (6 ảnh), gán KÍN mọi tán kể cả tán chạm mép, bằng
  # nét vẽ + Học & tô như vòng train nhưng soát kỹ hơn. Chỉ để CHẤM, không bao
  # giờ vào train. Dựng TRƯỚC vòng train. Học & tô ở đây chỉ học từ nét của
  # chính vòng này, nên bộ test không dính nét của bộ train.
  - id: test
    label: Bộ test (6 ảnh)
    kind: scribble
    role: test
    pick: {images_per_field: 1, crowns_per_image: all, skip_border: false, seed: 7}
    classifier:
      n_trees: 100
      max_depth: 12
      sigma_min: 0.7
      sigma_max: 5.0
      num_sigma: 4
      max_samples: 50000
      unlabeled_ratio: 4
      unlabeled_weight: 0.1

  # Bộ train: 4 ảnh mỗi ruộng (24 ảnh), gán kín. Ảnh cách ảnh test ≤ 3 khung
  # trong cùng đường bay bị loại (chụp trùng cây).
  - id: train
    label: Bộ train (24 ảnh)
    kind: scribble
    pick: {images_per_field: 4, crowns_per_image: all, skip_border: false, buffer_frames: 3, seed: 11}
    classifier:
      n_trees: 100
      max_depth: 12
      sigma_min: 0.7
      sigma_max: 5.0
      num_sigma: 4
      max_samples: 50000
      unlabeled_ratio: 4
      unlabeled_weight: 0.1

  # Bộ vàng vẽ tay (không dùng từ 13/10: bộ test ở trên thay nó). Bỏ dấu # để
  # bật lại; vòng vẽ tay cũng được tính là bộ chấm.
  # - id: gold
  #   label: Bộ vàng
  #   kind: manual                 # vẽ tay; Xong = phần chưa tô thành Không hoa
  #   pick: {crowns_per_field: 5, crowns_per_image: 3, skip_border: true, seed: 7}
  #   superpixel: {area_px: 50, compactness: 10}   # cọ bám siêu điểm ảnh (phím G)
  #   double: {annotator: B, crowns: 10}

  # Vòng 2: model (train trên bộ train) tô 300 tán mới; người chỉ duyệt. Trong
  # từng ruộng, 30% tán kém chắc nhất (entropy cao nhất trong crowns.csv) vào
  # hàng đợi trước, rồi 10% tán ngẫu nhiên để kiểm; còn lại nhận tự động khi chốt
  # vòng. Chạy trước khi duyệt:
  #   python scripts/flower_train.py --name r2
  #   python scripts/flower_predict.py --run runs/flower/r2 --round r2
  - id: r2
    label: Vòng 2
    kind: review
    model_run: runs/flower/r2
    pick: {crowns_per_field: 50, crowns_per_image: all, skip_border: true, buffer_frames: 3, seed: 13}
    review: {fix_top: 0.30, check_random: 0.10}
