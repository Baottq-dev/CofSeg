# Finetune Mask R-CNN R50-FPN (torchvision v2, trọng số COCO) trên bộ tán cà phê.
#
# Vai trò trong bảng benchmark: mốc nền hai giai đoạn kinh điển. Đầu mặt nạ
# 28x28 cố định cho mỗi vùng — với tán cạnh ~325 px thì mỗi ô nuốt ~12 px ảnh
# gốc, thấp hơn trần của YOLO-seg @1024 (lưới imgsz/4 = 5-10 px). Khoảng cách
# từ mốc này tới PointRend / Mask Transfiner (cùng backbone, chạy trên Linux)
# chính là thứ họ "tinh chỉnh biên" phải chứng minh.
#
# Đọc thẳng bộ COCO do app/ xuất; không cần bước sinh nhãn như YOLO.
#
# Độ phân giải ghi đè lúc chạy, tên thư mục run lấy giá trị thật:
#     python scripts/train.py --config configs/train/maskrcnn_r50.yaml --probe
#     python scripts/train.py --config configs/train/maskrcnn_r50.yaml --imgsz 1024 --batch 2
#     python scripts/train.py --config configs/train/maskrcnn_r50.yaml --imgsz 2048 --batch 1
# Xem toàn bộ tham số: --list-params

name: maskrcnn-r50
trainer: maskrcnn

data:
  root: data/export/dataset_v1
  train: train
  val: val
  # Cùng ngưỡng với configs/dataset/dataset_v1.yaml: loại đúng một nhãn hỏng 1.4 px2.
  min_area: 50.0
  # limit: 8   # chỉ để chạy khói; bỏ trống khi huấn luyện thật

train:
  # ---- độ phân giải và batch ----
  # imgsz là CẠNH DÀI sau khi thu, cùng nghĩa với YOLO. Ảnh 2560x1440 -> 1024x576.
  # Chưa đo vách bộ nhớ cho model này trên card 8 GB; chạy --probe trước, nó
  # chạy thật hai iteration và báo đỉnh bộ nhớ so với vách 7.0 GB.
  imgsz: 1024
  batch: 2
  epochs: 50

  # ---- tối ưu hoá: recipe tham chiếu của torchvision cho finetune ----
  # SGD lr 0.02 là cho batch 16 (8 GPU x 2); batch 2 thì ~0.01 là cùng tỉ lệ
  # tuyến tính đã làm tròn lên một chút vì finetune ngắn.
  optimizer: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  warmup_iters: 200
  cos_lr: true
  amp: true
  # 3 = đóng băng stem + layer1, mở layer2-4: mặc định torchvision khi finetune.
  trainable_backbone_layers: 3

  # ---- tăng cường cho ảnh UAV nadir ----
  # Ảnh chụp thẳng đứng không có chiều "trên": lật dọc và xoay 90° đều hợp lệ,
  # cho 8 biến thể hình học của mỗi ảnh mà không tốn gì.
  fliplr: 0.5
  flipud: 0.5
  rot90: true

  # ---- chấm val ----
  # Mỗi epoch chấm mask AP trên val bằng pycocotools (val <= 120 ảnh, ~1 phút).
  # best.pt theo AP; nhớ rằng val chỉ có 20 ảnh của một field ở dataset_v1.
  val_every: 1
  val_conf: 0.05
  patience: 0

  # workers=0 vì cùng lý do với YOLO: trên Windows mỗi worker spawn tiến trình
  # mới nạp lại torch và paging file không đủ (WinError 1455).
  workers: 0
  seed: 0
