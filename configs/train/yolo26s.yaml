# Finetune YOLO26-seg trên bộ tán cà phê.
#
# Vì sao chọn cỡ "s" chứ không phải "l": đo trên chính 6521 vùng của bộ này,
# nút thắt là ĐỘ PHÂN GIẢI chứ không phải dung lượng model. Lưới mặt nạ của
# YOLO là imgsz/4, nên ở imgsz=1280 mỗi ô nuốt 8 px ảnh gốc, ở 640 là 16 px.
# Với 8 GB VRAM, đổi "s" lấy imgsz cao là đánh đổi có lãi; đổi "l" lấy imgsz
# thấp là đánh đổi lỗ.

# Chỉ định danh model, KHÔNG kèm siêu tham số. imgsz/batch/epochs được trainer
# gắn vào tên thư mục run từ giá trị THẬT lúc chạy, nên nhét "1536" vào đây sẽ
# thành sai ngay lần đầu bạn gõ --imgsz 640.
name: yolo26s-seg
trainer: yolo
model: weights/yolo26s-seg.pt

data:
  # data.yaml của một fold do scripts/make_fold.py cắt ra. Đổi fold:
  #     --set data.yaml=data/export/f2/data.yaml
  yaml: data/export/f4/data.yaml
  # Ảnh dày nhất có 48 vùng; con số này để bước dò VRAM ước lượng đúng.
  max_objects_per_image: 48

train:
  # ---- độ phân giải: tham số quan trọng nhất của cấu hình này ----
  # Trần Boundary IoU tính từ chính 6521 vùng của bộ này (lưới mặt nạ = imgsz/4):
  #     imgsz   ô lưới   trần B-IoU
  #      1280    8.0 px      0.852
  #      1536    6.7 px     ~0.88
  #      2048    5.0 px      0.914
  #
  # Batch thì ĐO THẬT, không lấy theo --probe: autobatch chỉ tính chiều thuận
  # nên đề xuất 5 ở 1536, trong khi chạy thật batch 4 đã chạm 7.2 GB. Trên card
  # 8 GB này có một vách đứng quanh 7.0 GB — vượt qua thì driver tràn sang RAM
  # hệ thống thay vì báo OOM:
  #     1536 / batch 2  ->  6.99 GB   1.25 it/s   ~2.3 phút/epoch
  #     1280 / batch 4  ->  7.22 GB   179 s/it    ~4h10/epoch  (đã tràn)
  # Batch 4 ở độ phân giải THẤP HƠN lại chậm hơn 220 lần. Nên chọn 1536/2.
  #
  # Đánh đổi phải biết: batch 2 làm thống kê BatchNorm nhiễu. Chấp nhận được
  # vì đây là finetune từ trọng số đã học, BN vào cuộc đã ở trạng thái hợp lý,
  # và nbs=64 vẫn gộp gradient cho phía tối ưu hoá. Nếu kết quả cho thấy BN là
  # vấn đề thì hạ imgsz xuống 1280 để lấy batch 3 (trần thấp hơn) hoặc đóng
  # băng BN — đừng tăng batch ở 1536, nó rơi qua vách.
  imgsz: 1536
  batch: 2
  # Độ phân giải MỤC TIÊU của nhánh mặt nạ = imgsz/mask_ratio. Mặc định 4 hạ
  # giám sát xuống 320 khi imgsz=1280. Hạ tham số này làm biên sắc hơn nhưng
  # tốn thêm bộ nhớ — đáng thử ở lần quét sau, sau khi có mốc nền.
  mask_ratio: 4
  # Tán mọc sát nhau nên mặt nạ chồng lấn; giữ True để chúng không đè nhau.
  overlap_mask: true

  epochs: 100
  patience: 30
  # optimizer: auto -> ultralytics tự chọn AdamW và tự đặt lr0/momentum theo
  # số lớp và số epoch (lần chạy thử nó chọn lr=0.002). Đặt lr0 tay ở đây sẽ
  # KHÔNG có tác dụng chừng nào optimizer còn là auto.
  optimizer: auto
  cos_lr: true
  amp: true

  # workers=0 chứ không phải 8 như mặc định: trên Windows mỗi dataloader worker
  # spawn một tiến trình mới và nạp lại torch, và trên máy này paging file
  # không đủ cho việc đó -> WinError 1455 "The paging file is too small",
  # gãy giữa chừng khi đang quét nhãn. 0 nghĩa là nạp dữ liệu trong tiến trình
  # chính: chậm hơn một chút nhưng không gãy. Nếu bạn tăng paging file của
  # Windows rồi khởi động lại thì nâng lên 2-4 sẽ nhanh hơn.
  workers: 0

  seed: 0
  deterministic: true
  val: true
  plots: true

  # ---- tăng cường cho ảnh UAV nadir ----
  # Mặc định của ultralytics giả định ảnh có chiều "trên"; ảnh chụp thẳng
  # đứng thì không, nên lật dọc và xoay bất kỳ đều hợp lệ.
  flipud: 0.5
  fliplr: 0.5
  degrees: 180.0
  # Chỉ 337 ảnh train, nên dán ghép giúp bù dữ liệu. Đây là tham số dành cho
  # phân đoạn, mặc định tắt. Nó cũng làm tăng số vùng mỗi ảnh, nhưng có chặn
  # trên (không quá gấp đôi), khác hẳn mosaic ở dưới.
  copy_paste: 0.3

  # ---- mosaic TẮT, và đây không phải lựa chọn thẩm mỹ ----
  # Bộ nhớ của nhánh mặt nạ tỉ lệ với SỐ VÙNG trong batch, không phải với
  # cấu hình tĩnh. Đo được trong cùng một lần chạy:
  #      63 vùng  ->  6.04 GB   1.7 it/s
  #     130 vùng  ->  7.23 GB   1.2 s/it   (đã tràn)
  # Mosaic ghép 4 ảnh làm một, nên batch 2 thực chất chứa 8 ảnh nguồn. Ảnh ở
  # đây dày vùng (trung vị 15, tối đa 48), nên có những batch vọt lên vài trăm
  # vùng và rơi qua vách 7 GB một cách NGẪU NHIÊN — lần chạy trước tràn ở 74%
  # của epoch 1, không báo lỗi, chỉ chậm đi.
  # Tắt mosaic thì số vùng mỗi batch bị chặn bởi 48 x batch, tức bộ nhớ thành
  # tiên đoán được. Nó cũng khớp với một lý do độc lập: mosaic thu nhỏ tán vốn
  # đã lớn, đi ngược mục tiêu giữ độ phân giải đường biên.
  mosaic: 0.0
  close_mosaic: 0
  scale: 0.5
