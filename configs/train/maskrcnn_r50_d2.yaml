# Mask R-CNN R50-FPN trên detectron2 — MỐC SỐ 0 của bảng benchmark.
#
# Vì sao có bản này bên cạnh maskrcnn_r50.yaml (torchvision): Cascade và
# Mask2Former chỉ có trong detectron2, và "Cascade hơn Mask R-CNN bao nhiêu"
# chỉ có nghĩa khi hai bên chạy cùng một mã, cùng mapper, cùng lịch lr. Bản
# torchvision vẫn dùng để chạy sớm ở nhà (Windows); vào bảng thì dùng bản này.
#
# Chạy trên máy Linux có detectron2 (scripts/remote/setup.sh). Ở nhà chỉ
# --print-config / --list-params chạy được; --probe và train cần detectron2.
#
#     python scripts/train.py --config configs/train/maskrcnn_r50_d2.yaml --set data.root=data/export/f4 --workers 8
#     python scripts/train.py --config configs/train/maskrcnn_r50_d2.yaml --probe
#     python scripts/train.py --config configs/train/maskrcnn_r50_d2.yaml --set data.limit=16 --epochs 1   # khói

name: maskrcnn-r50-d2
trainer: detectron2

model:
  # maskrcnn | cascade | mask2former | pointrend. Config và trọng số COCO lấy
  # từ model zoo theo arch; ghi đè bằng model.config_file / model.weights.
  arch: maskrcnn

data:
  # Một fold do scripts/make_fold.py cắt ra; đổi fold: --set data.root=data/export/f2
  root: data/export/f4
  train: train
  val: val
  test: test
  min_area: 50.0
  # limit: 16   # chỉ để khói; bỏ trống khi huấn luyện thật

train:
  # imgsz là CẠNH DÀI sau khi thu, cùng nghĩa với YOLO/torchvision: 2560x1440
  # -> 1024x576 (detectron2 nhận cạnh ngắn 576 + trần cạnh dài 1024).
  imgsz: 1024
  batch: 4
  epochs: 50
  # lr trống = recipe gốc tỉ lệ theo batch: 0.02 x batch/16 (SGD, momentum
  # 0.9, weight decay 1e-4 của config zoo). Lịch: giảm 10x ở 70% và 90%.
  lr: null
  warmup_iters: 200
  amp: true

  # Ảnh nadir không có chiều "trên": lật dọc và xoay 90° đều hợp lệ.
  fliplr: 0.5
  flipud: 0.5
  rot90: true

  # Chấm mask AP trên val mỗi epoch (COCOEvaluator), giữ best.pth theo segm/AP.
  val_every: 1
  val_conf: 0.05
  max_det: 100

  # 0 trên Windows (paging file), 8 trên máy thuê: --workers 8
  workers: 0
  seed: 0
