[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coffee-seg"
version = "0.1.0"
description = "Segmentation từng cây cà phê & gán nhãn mật độ hoa (accuracy-first)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "canopyseg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers: gõ sai tên marker thì báo lỗi thay vì lặng lẽ chạy hết.
# --import-mode=importlib: không chèn tests/ vào sys.path, nên test luôn nạp
# canopyseg đã cài chứ không nhặt nhầm thư mục cạnh bên.
addopts = "-q --strict-markers --import-mode=importlib"
markers = [
    "gpu: cần GPU, bỏ qua khi chạy trên máy không có CUDA",
    "slow: chạy lâu hơn vài giây",
    "weights: cần file trọng số đã huấn luyện trong weights/",
]
filterwarnings = [
    "error::DeprecationWarning:canopyseg.*",
    # pycocotools 2.0.x còn gọi __array__ kiểu cũ trên numpy 2; không phải việc của ta.
    "ignore::DeprecationWarning:pycocotools.*",
]
